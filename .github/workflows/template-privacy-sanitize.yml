name: Sanitize legacy template examples

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'template-library.js'
      - 'tests/smoke.mjs'
      - 'scripts/sanitize-template-examples.py'
      - 'docs/**'
      - 'package.json'

permissions:
  contents: write

jobs:
  sanitize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install XML dependency
        run: python -m pip install lxml
      - name: Sanitize DOCX files and synchronize embedded copies
        run: python scripts/sanitize-template-examples.py
      - name: Commit generated template changes
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/camping templates/noise templates/dossiers/narcotics
          git add camping-templates-data.js noise-templates-data.js dossier-templates-data.js .axyp-template-privacy-v1
          if ! git diff --cached --quiet; then
            git commit -m "Sanitize legacy personal examples in dossier templates"
            git push origin "HEAD:${BRANCH_NAME}"
          fi

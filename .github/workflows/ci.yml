name: AX.YP CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "v0/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: axyp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install XML and DOCX validators
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils libreoffice
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate legal data
        run: npm run validate
      - name: Check source links
        run: npm run check-links
      - name: Run regression tests
        run: npm test
      - name: Build application
        run: npm run build

  browser-e2e:
    name: Production browser case lifecycle
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install XML and DOCX validators
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils libreoffice
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production application
        run: npm run build
      - name: Verify Chrome is available
        run: google-chrome --version
      - name: Run production browser E2E (Chrome)
        run: npm run test:e2e
      - name: Set up Mozilla Firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest
      - name: Set up GeckoDriver
        uses: browser-actions/setup-geckodriver@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Firefox and GeckoDriver
        run: |
          firefox --version
          geckodriver --version
      - name: Run production browser E2E (Firefox)
        run: npm run test:e2e:firefox

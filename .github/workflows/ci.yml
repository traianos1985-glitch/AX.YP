name: AX.YP CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: axyp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Inspect historical noise-law date reference
        run: node scripts/inspect-noise-legal-date.mjs
      - name: Validate legal data
        run: npm run validate
      - name: Check source links
        run: npm run check-links
      - name: Run regression tests
        run: npm test
      - name: Build application
        run: npm run build

name: AX.YP CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: axyp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Repair counterfeit embedded DOCX templates on the test branch
        run: |
          node scripts/patch-counterfeit-serial.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dossier-templates-data.js
          if ! git diff --cached --quiet; then
            git commit -m "Fix serial-number placeholders in counterfeit forms 02 and 03"
            git push origin "HEAD:refs/heads/${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi
      - name: Validate legal data
        run: npm run validate
      - name: Check source links
        run: npm run check-links
      - name: Run regression tests
        run: npm test
      - name: Build application
        run: npm run build
